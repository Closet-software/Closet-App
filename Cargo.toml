[package]
name = "h"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui_commonmark = { version = "0.26.0", features = ["fetch"] }
egui_extras = { version = "0.37.0", features = ["default","image","svg"] }
egui_tiles = "0.18.0"
image = "0.25.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
